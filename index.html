<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* ============================================================
   PIGEON CAN'T STOP
   A one-file, zero-dependency rhythm-meme pigeon game.
   Everything (art + audio) is generated procedurally.
   ============================================================ */

/* ---------------- utils ---------------- */
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function rint(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(p){ return Math.random()<p; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeOutBack(t){ var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

var _colorCache = {};
function rgba(r,g,b,a){
  var k = (r<<16)|(g<<8)|b;
  var c = _colorCache[k];
  if(!c){ c = 'rgb('+r+','+g+','+b+')'; _colorCache[k]=c; }
  if(a>=1) return c;
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function hexC(h){
  h = h.replace('#','');
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}

/* ---------------- canvas / viewport ---------------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 420, VH = 900;           // virtual portrait design size
var cssW=0, cssH=0, dpr=1, unit=1, ox=0, oy=0;

function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  cssW = window.innerWidth; cssH = window.innerHeight;
  canvas.width = Math.round(cssW*dpr);
  canvas.height = Math.round(cssH*dpr);
  unit = Math.min(cssW/VW, cssH/VH);
  ox = (cssW - VW*unit)/2;
  oy = (cssH - VH*unit)/2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });

function toVirtual(clientX, clientY){
  var rect = canvas.getBoundingClientRect();
  return { x:(clientX-rect.left-ox)/unit, y:(clientY-rect.top-oy)/unit };
}

/* ============================================================
   AUDIO ENGINE — every sound is synthesized live
   ============================================================ */
var AC=null, master, musicBus, sfxBus, noiseBuf;
var stepIndex=0, nextStepTime=0, schedTimer=null;

function makeNoiseBuffer(){
  var len = AC.sampleRate * 1;
  var buf = AC.createBuffer(1,len,AC.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function audioInit(){
  if(AC){ if(AC.state==='suspended'){ try{AC.resume();}catch(e){} } return; }
  var C = window.AudioContext||window.webkitAudioContext;
  if(!C) return;
  try{
    AC = new C();
    master = AC.createGain(); master.gain.value = 0.9;
    var comp = AC.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=6;
    master.connect(comp); comp.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value=0.0001; musicBus.connect(master);
    sfxBus = AC.createGain(); sfxBus.gain.value=1; sfxBus.connect(master);
    var dly=AC.createDelay(1); dly.delayTime.value=0.272;
    var fb=AC.createGain(); fb.gain.value=0.26;
    var wet=AC.createGain(); wet.gain.value=0.13;
    musicBus.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
    noiseBuf = makeNoiseBuffer();
    nextStepTime = AC.currentTime+0.08; stepIndex=0;
    if(schedTimer===null) schedTimer=setInterval(scheduleSteps,25);
  }catch(e){ AC=null; }
}

function env(g,t0,a,peak,dec){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec);
}
function tone(t0,f0,f1,dur,type,vol,dest,lp,q){
  if(!AC) return;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002),t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  var node=o;
  if(lp){ var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(lp,t0); f.Q.value=q||0.6; o.connect(f); node=f; }
  node.connect(g); g.connect(dest||musicBus);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(t0,dur,vol,ftype,freq,q,dest){
  if(!AC) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var f=AC.createBiquadFilter(); f.type=ftype||'highpass'; f.frequency.value=freq||7000; f.Q.value=q||0.7;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002),t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(dest||musicBus);
  s.start(t0); s.stop(t0+dur+0.03);
}

/* ---- the catchy loop ---- */
var SCALE = { C2:65.41, A2:110, F2:87.31, G2:98, C3:130.81, E3:164.81, G3:196, A3:220,
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392, A4:440, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880 };
// 16 eighth-notes: the dumbest, catchiest pigeon riff on earth
var MELODY = ['C5',null,'E5',null,'G5',null,'E5',null,'A5',null,'G5','E5',null,'D5','E5',null];
var BASSBAR = ['C2','C2','A2','F2'];

var audioMode = 'menu';   // 'menu' | 'play' | 'off'
function currentBPM(){
  if(audioMode==='play') return Math.min(100 + Math.min(G.combo,120)*0.85, 202);
  return 104;
}

function kick(t,soft){
  var o=AC.createOscillator(), g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(soft?110:160,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.12);
  g.gain.setValueAtTime(soft?0.5:0.95,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  o.connect(g); g.connect(musicBus);
  o.start(t); o.stop(t+0.22);
}
function hat(t,open){ noise(t, open?0.16:0.045, open?0.14:0.11, 'highpass', 7500, 0.7); }
function clap(t){
  for(var k=0;k<3;k++){ noise(t+k*0.018, 0.05, 0.25, 'bandpass', 1300, 1.4); }
}
function awkStab(t,vol){
  // fake goofy pigeon "AWK" vowel stab
  var f1=AC.createOscillator(), f2=AC.createOscillator(), g=AC.createGain(), bp=AC.createBiquadFilter();
  f1.type='square'; f2.type='sawtooth';
  f1.frequency.setValueAtTime(760,t); f1.frequency.exponentialRampToValueAtTime(420,t+0.14);
  f2.frequency.setValueAtTime(766,t); f2.frequency.exponentialRampToValueAtTime(424,t+0.14);
  bp.type='bandpass'; bp.frequency.setValueAtTime(500,t); bp.frequency.exponentialRampToValueAtTime(1500,t+0.07);
  bp.frequency.exponentialRampToValueAtTime(700,t+0.16); bp.Q.value=2.2;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  f1.connect(bp); f2.connect(bp); bp.connect(g); g.connect(musicBus);
  f1.start(t); f2.start(t); f1.stop(t+0.2); f2.stop(t+0.2);
}
function yeahStab(t){
  var o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(200,t);
  o.frequency.exponentialRampToValueAtTime(620,t+0.22);
  lp.type='lowpass'; lp.frequency.setValueAtTime(900,t);
  lp.frequency.exponentialRampToValueAtTime(3200,t+0.2); lp.Q.value=1.2;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.2,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
  o.connect(lp); lp.connect(g); g.connect(musicBus);
  o.start(t); o.stop(t+0.33);
}
function riser(t,dur){
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var bp=AC.createBiquadFilter(); bp.type='highpass';
  bp.frequency.setValueAtTime(400,t);
  bp.frequency.exponentialRampToValueAtTime(9000,t+dur);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.22,t+dur*0.85);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.05);
  s.connect(bp); bp.connect(g); g.connect(musicBus);
  s.start(t); s.stop(t+dur+0.08);
}

function playStep(i,t){
  var c = G.combo;
  var play = audioMode==='play';
  var inten = play ? 1 : 0.5;
  // four on the floor
  if(i%4===0) kick(t, !play);
  // offbeat bass
  if(i%4===2){
    var bn = SCALE[BASSBAR[Math.floor(i/16)%4]];
    tone(t,bn,bn*0.99,0.22,'sawtooth',0.34*inten,musicBus,520,2);
  }
  // hats on 8ths
  if(i%4===2) hat(t, c>=20 && (i%8===6));
  // clap layers at 10
  if(c>=10 && (i===4||i===12||i===20||i===28)) clap(t);
  // lead riff on 8ths
  if(i%2===0){
    var m = MELODY[i/2];
    if(m) tone(t, SCALE[m]* (play?1:1), SCALE[m], 0.16, 'square', 0.13*inten, musicBus, 2600, 0.8);
    if(m) tone(t, SCALE[m]*1.005, SCALE[m]*1.005, 0.16, 'triangle', 0.07*inten, musicBus);
  }
  // 16th arp from 20
  if(c>=20){
    var arp=['C5','E5','G5','A5'][i%4];
    tone(t, SCALE[arp]*2, SCALE[arp]*2, 0.07, 'triangle', 0.07, musicBus);
  }
  // absurd vocal stabs from 30
  if(play && c>=30 && i===0) awkStab(t, c>=100?0.22:0.15);
  if(play && c>=50 && i===16) yeahStab(t);
  // rave riser at 100
  if(play && c>=100 && i===24){
    var spb=60/currentBPM();
    riser(t, spb*2);
  }
}
function scheduleSteps(){
  if(!AC) return;
  try{
    if(audioMode==='off'){ return; }
    var dur = 60/currentBPM()/4;
    while(nextStepTime < AC.currentTime + 0.18){
      playStep(stepIndex, nextStepTime);
      nextStepTime += dur;
      stepIndex = (stepIndex+1)%32;
    }
  }catch(e){}
}
function musicStart(mode){
  audioMode = mode;
  if(!AC) return;
  try{
    stepIndex=0; nextStepTime=AC.currentTime+0.1;
    musicBus.gain.cancelScheduledValues(AC.currentTime);
    musicBus.gain.setTargetAtTime(mode==='play'?0.75:0.32, AC.currentTime, 0.05);
  }catch(e){}
}
function musicStop(){
  audioMode='off';
  if(!AC) return;
  try{ musicBus.gain.cancelScheduledValues(AC.currentTime);
       musicBus.gain.setTargetAtTime(0.0001, AC.currentTime, 0.08); }catch(e){}
}

/* ---- SFX (extra meme) ---- */
// pigeon "coo" formant stab — two detuned sines through a wobbling bandpass
function cooStab(t,vol,pitch,wob){
  if(!AC) return;
  try{
    var f1=AC.createOscillator(), f2=AC.createOscillator(), g=AC.createGain(), bp=AC.createBiquadFilter();
    f1.type='sine'; f2.type='sine';
    var base=620*(pitch||1);
    f1.frequency.setValueAtTime(base,t);
    f1.frequency.exponentialRampToValueAtTime(base*0.72,t+0.12);
    f2.frequency.setValueAtTime(base*1.006,t);
    f2.frequency.exponentialRampToValueAtTime(base*0.725,t+0.12);
    bp.type='bandpass'; bp.Q.value=3.4;
    bp.frequency.setValueAtTime(900,t);
    bp.frequency.exponentialRampToValueAtTime(1800,t+0.06);
    bp.frequency.exponentialRampToValueAtTime(700,t+0.16);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    f1.connect(bp); f2.connect(bp); bp.connect(g); g.connect(sfxBus);
    f1.start(t); f2.start(t); f1.stop(t+0.22); f2.stop(t+0.22);
  }catch(e){}
}
function sfxPeck(perfect,combo){
  if(!AC) return;
  try{
    var t=AC.currentTime;
    var base=300*Math.pow(1+combo*0.012, perfect?1.18:1);
    // crispy crunch
    tone(t,base,base*1.7,0.09,'square',0.2,sfxBus);
    noise(t,0.04,0.16,'highpass',2800);
    if(perfect){
      // sparkle chime
      tone(t+0.02,1200,1800,0.1,'triangle',0.12,sfxBus);
      tone(t+0.04,1800,2600,0.08,'triangle',0.08,sfxBus);
      // happy pigeon coo "NOM!"
      cooStab(t+0.03, 0.22, 1+combo*0.004);
      // random extra meme chirp at high combos
      if(combo>=30 && chance(0.5)){
        cooStab(t+0.09, 0.14, 1.4+combo*0.003, true);
      }
    }else{
      // softer "coo" for good hits
      cooStab(t+0.02, 0.12, 0.95);
    }
  }catch(e){}
}
function sfxMilestone(level){
  if(!AC) return;
  try{
    var t=AC.currentTime;
    // ascending fanfare
    var notes=['C4','E4','G4','C5','E5','G5'];
    for(var i=0;i<6;i++) tone(t+i*0.055, SCALE[notes[i]], SCALE[notes[i]], 0.18,'square',0.16,sfxBus);
    // big "BWAAAH" horn stab
    tone(t,180,182,0.5,'sawtooth',0.18,sfxBus,900,2);
    tone(t+0.01,270,272,0.5,'square',0.12,sfxBus);
    if(level>=2){ // airhorn-ish blast
      tone(t+0.12,520,523,0.5,'sawtooth',0.16,sfxBus,3200);
      tone(t+0.12,784,787,0.5,'square',0.12,sfxBus);
    }
    if(level>=4){ // 50: jetpack whoosh
      var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      var bp=AC.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.setValueAtTime(400,t); bp.frequency.exponentialRampToValueAtTime(2400,t+0.45);
      var g=AC.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.2,t+0.4); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
      s.connect(bp); bp.connect(g); g.connect(sfxBus); s.start(t); s.stop(t+0.6);
    }
    if(level>=5){ // 100: rave airhorn + vuvuzela stack
      tone(t,520,523,0.7,'sawtooth',0.16,sfxBus,4000);
      tone(t,784,787,0.7,'square',0.12,sfxBus);
      tone(t+0.05,660,660,0.7,'sawtooth',0.10,sfxBus);
    }
  }catch(e){}
}
function sfxWomp(){
  if(!AC) return;
  try{
    var t=AC.currentTime;
    // sad trombone descending
    tone(t,SCALE.E3,SCALE.E3,0.28,'sawtooth',0.22,sfxBus,600,3);
    tone(t+0.18,SCALE.G3,SCALE.C3,0.45,'sawtooth',0.22,sfxBus,600,3);
    tone(t+0.4,SCALE.C3,SCALE.A2,0.5,'sawtooth',0.18,sfxBus,500,3);
    // tiny "boop" punctuation
    tone(t+0.7,220,160,0.18,'square',0.12,sfxBus);
  }catch(e){}
}
function sfxVeggieFail(){
  if(!AC) return;
  try{
    var t=AC.currentTime;
    // gagging "BLEGH" — rapid pitch stutter down
    var o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
    o.type='sawtooth';
    o.frequency.setValueAtTime(420,t);
    for(var k=0;k<5;k++){
      o.frequency.setValueAtTime(420-k*60, t+k*0.06);
    }
    o.frequency.exponentialRampToValueAtTime(70,t+0.5);
    lp.type='lowpass'; lp.frequency.value=1100; lp.Q.value=2;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
    o.connect(lp); lp.connect(g); g.connect(sfxBus);
    o.start(t); o.stop(t+0.6);
    noise(t+0.2,0.25,0.12,'lowpass',700);
  }catch(e){}
}
function sfxBwargh(){
  if(!AC) return;
  try{
    var t=AC.currentTime;
    var o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter(), lfo=AC.createOscillator(), lg=AC.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(80,t+0.7);
    lp.type='lowpass'; lp.frequency.value=1500; lp.Q.value=2.4;
    lfo.type='square'; lfo.frequency.value=26; lg.gain.value=260;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.4,t+0.03);
    g.gain.setValueAtTime(0.32,t+0.4);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
    o.connect(lp); lp.connect(g); g.connect(sfxBus);
    o.start(t); lfo.start(t); o.stop(t+0.8); lfo.stop(t+0.8);
    noise(t,0.6,0.12,'lowpass',900);
    // final raspberry "PFFT"
    setTimeout(function(){ try{
      var t2=AC.currentTime;
      var o2=AC.createOscillator(), g2=AC.createGain();
      o2.type='sawtooth';
      o2.frequency.setValueAtTime(120,t2);
      o2.frequency.exponentialRampToValueAtTime(40,t2+0.25);
      g2.gain.setValueAtTime(0.0001,t2);
      g2.gain.exponentialRampToValueAtTime(0.18,t2+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,t2+0.3);
      o2.connect(g2); g2.connect(sfxBus);
      o2.start(t2); o2.stop(t2+0.32);
      noise(t2,0.25,0.15,'lowpass',500);
    }catch(e){} }, 650);
  }catch(e){}
}
function sfxUi(){
  if(!AC) return;
  try{ tone(AC.currentTime,600,900,0.05,'square',0.08,sfxBus); }catch(e){}
}

/* ============================================================
   PARTICLES — one pooled, single-pass typed-array system
   ============================================================ */
var PMAX = 700;
var px=new Float32Array(PMAX), py=new Float32Array(PMAX),
    pvx=new Float32Array(PMAX), pvy=new Float32Array(PMAX),
    plife=new Float32Array(PMAX), pmax=new Float32Array(PMAX),
    psize=new Float32Array(PMAX), pr=new Uint8Array(PMAX),
    pg=new Uint8Array(PMAX), pb=new Uint8Array(PMAX),
    ptype=new Uint8Array(PMAX), prot=new Float32Array(PMAX), pvr=new Float32Array(PMAX),
    pgrav=new Float32Array(PMAX), pz=new Uint8Array(PMAX);
var pCursor=0;
function pspawn(o){
  var i=pCursor; pCursor=(pCursor+1)%PMAX;
  px[i]=o.x; py[i]=o.y; pvx[i]=o.vx||0; pvy[i]=o.vy||0;
  plife[i]=pmax[i]=o.life||1; psize[i]=o.size||4;
  pr[i]=o.r||255; pg[i]=o.g||255; pb[i]=o.b||255;
  ptype[i]=(o.type===undefined?0:o.type); prot[i]=o.rot||0; pvr[i]=o.vr||0;
  pgrav[i]=o.grav||0; pz[i]=o.z||1;
}
function pburst(x,y,arr,n,spd,type,life){
  for(var k=0;k<n;k++){
    var col = pick(arr), a=rnd(0,TAU), sp=rnd(spd*0.3,spd);
    pspawn({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:rnd(life*0.6,life),
      size:rnd(3,7),r:col[0],g:col[1],b:col[2],type:type||1,rot:rnd(0,TAU),vr:rnd(-8,8),grav:260,z:1});
  }
}
function pupdate(dt){
  for(var i=0;i<PMAX;i++){
    if(plife[i]<=0) continue;
    plife[i]-=dt;
    pvy[i]+=pgrav[i]*dt;
    px[i]+=pvx[i]*dt; py[i]+=pvy[i]*dt;
    prot[i]+=pvr[i]*dt;
  }
}
function pdraw(layer){
  for(var i=0;i<PMAX;i++){
    if(plife[i]<=0 || pz[i]!==layer) continue;
    var al = clamp(plife[i]/pmax[i],0,1);
    ctx.fillStyle=rgba(pr[i],pg[i],pb[i],al);
    var s=psize[i];
    if(ptype[i]===0){ // soft dot
      ctx.beginPath(); ctx.arc(px[i],py[i],s,0,TAU); ctx.fill();
    }else if(ptype[i]===1){ // rotating rect
      ctx.save(); ctx.translate(px[i],py[i]); ctx.rotate(prot[i]);
      ctx.fillRect(-s/2,-s/2,s,s*0.7); ctx.restore();
    }else if(ptype[i]===2){ // streak
      ctx.strokeStyle=rgba(pr[i],pg[i],pb[i],al*0.7); ctx.lineWidth=s*0.4;
      ctx.beginPath(); ctx.moveTo(px[i],py[i]); ctx.lineTo(px[i]-pvx[i]*0.02,py[i]-pvy[i]*0.02); ctx.stroke();
    }else{ // ring bubble
      ctx.strokeStyle=rgba(pr[i],pg[i],pb[i],al*0.8); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(px[i],py[i],s,0,TAU); ctx.stroke();
      ctx.fillStyle=rgba(255,255,255,al*0.5);
      ctx.beginPath(); ctx.arc(px[i]-s*0.3,py[i]-s*0.3,s*0.25,0,TAU); ctx.fill();
    }
  }
}
function pclear(){
  for(var i=0;i<PMAX;i++) plife[i]=0;
}

  if(beat < 2) return {beat:beat,kind:'food',food:pick(FOOD_TYPES),gone:false};
  if(beat < 8) return {beat:beat,kind:'food',food:pick(FOOD_TYPES),gone:false};
  var pBad = clamp((beat-12)*0.0045,0,0.18);
  var pEmpty = clamp((beat-8)*0.006,0,0.24);
  var r=Math.random();
  if(r<pBad && prevKind!=='bad') return {beat:beat,kind:'bad',food:'broccoli',gone:false};
  if(r<pBad+pEmpty) return {beat:beat,kind:'empty',gone:false};
  return {beat:beat,kind:'food',food:pick(FOOD_TYPES),gone:false};
}
function fillQueue(){
  while(G.nextBeat - G.beatClock < 20){
    var prev = G.targets.length? G.targets[G.targets.length-1].kind : 'food';
    G.targets.push(genTarget(G.nextBeat, prev));
    G.nextBeat++;
  }
}
function nearestTarget(){
  var best=null, bd=999;
  for(var i=0;i<G.targets.length;i++){
    var tg=G.targets[i];
    if(tg.gone) continue;
    var d=tg.beat-G.beatClock;
    if(d<-1||d>4) continue;
    if(Math.abs(d)<Math.abs(bd)){ bd=d; best=tg; }
  }
  return best?{t:best,d:bd}:null;
}
function goodWindow(){ return (0.36 - 0.14*clamp(G.combo/110,0,1)); }

/* ============================================================
   INPUT
   ============================================================ */
function primaryAction(){
  audioInit();
  if(!AC) startRunMaybe(); // still playable without audio
  if(AC && AC.state==='suspended') AC.resume();
  if(G.state==='title'){ startRun(); return; }
  if(G.state==='over'){ startRun(); return; }
  if(G.state==='play'){ doPeck(); }
}
function startRunMaybe(){ if(G.state!=='play') startRun(); }

function startRun(){
  audioInit();
  G.state='play';
  G.combo=0; G.score=0; G.beatClock=0; G.targets=[]; G.nextBeat=2;
  G.runStart=performance.now(); G.runLen=0;
  G.peckAnim=0; G.expr='idle'; G.exprTimer=0;
  G.comboPop=0; G.zoomPunch=0; G.shake=0; G.banner=null;
  G.flashT=0; G.freezeT=0; G.derpT=0; G.speedLines=0; G.beatPulse=0; G.lastBeatInt=-1;
  G.event=null; G.lastEventBar=-1; G.hintBeats=true; G.milestoneHit=0;
  texts=[]; waves=[];
  fillQueue();
  musicStart('play');
}

function doPeck(){
  G.peckAnim=0.0001; G.peckHit=false;
  var w = goodWindow();
  var n = nearestTarget();
  if(n && Math.abs(n.d) <= w){
    if(n.t.kind==='empty'){ return failRun('PECKED THE VOID. WHY.'); }
    if(n.t.kind==='bad'){ n.t.gone=true; return failRun('VEGGIE DETECTED. GROSS.'); }
    // HIT
    n.t.gone=true;
    G.peckHit=true;
    var perfect = Math.abs(n.d)<=0.13;
    G.combo++;
    G.score += perfect?10:5;
    G.comboPop=1; G.zoomPunch=Math.min(G.zoomPunch+0.14+G.combo*0.005,0.6);
    G.shake=Math.min(G.shake+3+G.combo*0.07,11);
    sfxPeck(perfect,G.combo);
    var tp = targetPos(n.t);
    var col = FOOD_COLOR[n.t.food]||[255,255,255];
    pburst(tp.x,tp.y,[col,[255,255,255]],perfect?26:16,260,1,0.7);
    if(perfect){
      showJudge('PERFECT!','#fff3a8');
      // white flash for perfect
      G.flashT=0.32; G.flashCol='#ffffff';
      G.speedLines=Math.min(G.speedLines+0.4,1);
      if(chance(0.35)) addText(tp.x,tp.y-30,pick(PERFECT_WORDS),16,'#ffffff');
      addWave(tp.x,tp.y,64,'#ffffff',4);
      // bigger confetti burst at high combo
      if(G.combo>=30){ pburst(tp.x,tp.y,[[255,255,255],[255,230,120],[120,220,255]],18,300,1,1.0); }
    }else{
      showJudge('GOOD','#8ff7ff');
      addWave(tp.x,tp.y,42,'#8ff7ff',3);
    }
    // meme expression on hit
    if(perfect){
      if(G.combo>=50 && chance(0.4)){ G.expr='money'; G.exprTimer=0.5; }
      else if(G.combo>=20 && chance(0.3)){ G.expr='smug'; G.exprTimer=0.4; }
      else { G.expr='happy'; G.exprTimer=0.28; }
    } else {
      G.expr='happy'; G.exprTimer=0.28;
    }
    checkMilestones();
    if(G.combo>=24 && chance(0.18)) addText(210+rnd(-60,60),260, pick(['HEH','NOM','TOO EASY','AGAIN','COWARD?']),18,'#ffe98a');
    return;
  }
  // air peck = failure (tell the player WHICH side they missed on)
  if(n && n.d < 0) return failRun('TOO LATE. THE PIGEON IS DISGUSTED.');
  return failRun(n ? 'TOO EARLY. EMBARRASSING.' : 'AIR PECK. CUSTOM CONTENT.');
}

function checkMilestones(){
  for(var i=0;i<MILESTONES.length;i++){
    var m=MILESTONES[i];
    if(G.combo>=m.at && G.milestoneHit<m.at){
      G.milestoneHit=m.at;
      G.banner={title:m.title,sub:m.sub,t:1.6,max:1.6};
      G.zoomPunch=Math.min(G.zoomPunch+0.5,0.95);
      G.shake=Math.min(G.shake+9,16);
      G.freezeT=0.45;
      G.flashT=0.5; G.flashCol='#fff6c8';
      G.speedLines=1;
      sfxMilestone(m.level);
      pburst(210,430,[[255,226,80],[255,120,220],[80,240,255],[255,255,255]],60,420,1,1.3);
      addWave(210,430,260, SCENES[sceneIdx].accent, 12);
      G.expr='wow'; G.exprTimer=0.8;
      if(m.at===50){ // confetti rain
        for(var k=0;k<40;k++) pspawn({x:rnd(0,420),y:rnd(-80,0),vx:rnd(-20,20),vy:rnd(60,160),
          life:rnd(1.5,2.6),size:rnd(4,8),r:rint(40,255),g:rint(40,255),b:rint(40,255),type:1,vr:rnd(-8,8),grav:120,z:0});
      }
    }
  }
}

function failRun(reason){
  if(G.state!=='play') return;
  G.state='fail';
  G.failReason=reason;
  G.failAt=performance.now();
  G.bwarghDone=false; G.stareHead=0;
  G.shake=20; G.zoomPunch=0.5; G.freezeT=0.5;
  G.expr='shock'; G.exprTimer=0.4;
  G.runLen=(performance.now()-G.runStart)/1000;
  if(G.combo>G.best){ G.best=G.combo; try{localStorage.setItem('pcs_best',String(G.best));}catch(e){} }
  musicStop();
  // meme fail sfx by reason
  var isVeg = reason.indexOf('VEGGIE')>=0;
  if(isVeg) sfxVeggieFail(); else sfxWomp();
  // red screen flash (or purple for veggie)
  G.flashT=0.6; G.flashCol = isVeg ? '#b15bff' : '#ff3b3b';
  pburst(210,640,[[120,255,120],[180,120,255]],12,120,1,0.9);
  // big red judgment at the peck lane so every failure reads at a glance
  var JM={
    'TOO EARLY. EMBARRASSING.':['TOO EARLY!','#ff7a7a'],
    'TOO LATE. THE PIGEON IS DISGUSTED.':['TOO LATE!','#ff7a7a'],
    'AIR PECK. CUSTOM CONTENT.':['AIR PECK!','#ff7a7a'],
    'THE SNACK ESCAPED. SHAME.':['TOO LATE!','#ff7a7a'],
    'VEGGIE DETECTED. GROSS.':['VEGGIE?!','#c98bff'],
    'PECKED THE VOID. WHY.':['VOID?!','#ff7a7a']
  }[reason];
  if(JM){ showJudge(JM[0],JM[1]); addWave(DISC.x,DISC.y+DISC.R-30,96,JM[1],7); }
}

var DISC={x:210,y:420,R:150};
function targetPos(tg){
  var step=TAU/8;
  var d = tg.beat - G.beatClock;
  var ang = Math.PI/2 + d*step;
  var r = DISC.R-30;
  return { x:DISC.x+Math.cos(ang)*r, y:DISC.y+Math.sin(ang)*r, ang:ang, d:d };
}

var bgCache = {};
// deterministic rooftop skyline + windows (built once, no per-frame randomness)
var SKYLINE = (function(){
  var arr=[], bx=-10;
  for(var i=0;i<9;i++){
    var w=46+((i*29)%24), h=120+((i*53)%120);
    arr.push({x:bx,w:w,h:h,ant:i%2===0});
    bx+=w-6;
  }
  return arr;
})();
var SKY_WINDOWS = (function(){
  var arr=[];
  for(var i=0;i<26;i++){
    arr.push({x:14+(i*61)%400, y:650+(i*47)%100});
  }
  return arr;
})();
function grad(g,stops){
  var gr=g.createLinearGradient(0,0,0,VH);
  stops.forEach(function(s){ gr.addColorStop(s[0],s[1]); });
  return gr;
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

function drawScene(t){
  var sc=SCENES[sceneIdx];
  ctx.fillStyle=grad(ctx,[[0,sc.bg[0]],[0.45,sc.bg[1]],[0.75,sc.bg[2]],[1,sc.bg[3]]]);

  if(sc.amb==='mote'){

    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(210,sy,120,0,TAU); ctx.fill();
    ctx.fillStyle='#2c2350';
    for(var i=0;i<SKYLINE.length;i++){
      var b=SKYLINE[i];

    }
    ctx.fillStyle='rgba(255,220,120,0.75)';
    for(var wi=0;wi<SKY_WINDOWS.length;wi++){
      var wn=SKY_WINDOWS[wi];

  else if(sc.amb==='rain'){

    });
    // wet floor
    ctx.fillStyle='#0a0518'; ctx.fillRect(-40,772,VW+80,130);
    var rg=ctx.createLinearGradient(0,772,0,830);
    rg.addColorStop(0,'rgba(255,47,179,0.25)'); rg.addColorStop(1,'rgba(255,47,179,0)');
    ctx.fillStyle=rg; ctx.fillRect(-40,772,VW+80,60);
  }
  else if(sc.amb==='confetti'){
    // spotlights
    for(var s2=0;s2<3;s2++){
      var ang=Math.sin(t*0.8+s2*2.1)*0.5+(s2-1)*0.5;
      ctx.save(); ctx.translate(210,-40); ctx.rotate(ang);
      var beam=ctx.createLinearGradient(0,0,0,760);
      beam.addColorStop(0,['rgba(255,210,63,0.22)','rgba(56,243,176,0.22)','rgba(255,79,154,0.22)'][s2]);
      beam.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=beam; ctx.beginPath();
      ctx.moveTo(-30,0); ctx.lineTo(120,780); ctx.lineTo(-120,780); ctx.lineTo(30,0); ctx.fill();
      ctx.restore();
    }
    // disco ball
    ctx.save(); ctx.translate(210,88); ctx.rotate(t*0.8);
    ctx.fillStyle='#cfd6ff'; ctx.beginPath(); ctx.arc(0,0,26,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.8)';
    for(var m=0;m<8;m++){ ctx.fillRect(-22+(m%4)*12,-18+Math.floor(m/4)*16,5,5); }
    ctx.strokeStyle='#5a5488'; ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(0,-60); ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#0a0c2c'; ctx.fillRect(-40,792,VW+80,110);
  }
  else if(sc.amb==='glitch'){

    ctx.strokeStyle='rgba(255,45,215,0.35)'; ctx.lineWidth=2;

    }
    for(var gy2=0;gy2<8;gy2++){

    // scanlines

    for(var sl=0;sl<VH;sl+=6) ctx.fillRect(0,sl,VW,2);

    ctx.fillStyle='#ff2dd7'; ctx.beginPath(); ctx.arc(352+fx2,128,46,0,TAU); ctx.fill();
    ctx.fillStyle=sc.bg[1]||'#110718';
    ctx.beginPath(); ctx.arc(336+fx2,120,44,0,TAU); ctx.fill();
  }
  else { // bubble / park

    ctx.fillStyle=sun2; ctx.beginPath(); ctx.arc(320,160,80,0,TAU); ctx.fill();
    for(var c2=0;c2<4;c2++){
      var cx2=((c2*160 + t*14)%620)-100, cy2=140+(c2%3)*90;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(cx2,cy2,26,0,TAU); ctx.arc(cx2+24,cy2-10,22,0,TAU); ctx.arc(cx2+48,cy2,24,0,TAU); ctx.fill();
    }
    ctx.fillStyle='#54c98f'; ctx.beginPath(); ctx.ellipse(110,830,220,90,0,0,TAU); ctx.fill();

/* ============================================================
   THE PIGEON — insufferable. Expressions + autonomous life.
   ============================================================ */
function drawPigeon(t, cx, cy, dt){
  var sc=SCENES[sceneIdx];
  // behavior flags from combo
  var bHeadbang = G.state==='play' && G.combo>=10;
  var bSpin     = G.state==='play' && G.combo>=20;
  var bShades   = G.state==='play' && G.combo>=30;
  var bFly      = G.state==='play' && G.combo>=50;
  var bRave     = G.state==='play' && G.combo>=100;

  // timers
  G.breatheT += dt;
  G.nextBlink -= dt;
  if(G.nextBlink<=0){ G.blink=0.16; G.nextBlink=rnd(1.6,4.2); }
  if(G.blink>0) G.blink-=dt;
  if(G.peckAnim>0){
    var pd = 0.22 - Math.min((G.bps||1.8)*0.035,0.11);
    G.peckAnim += dt/Math.max(pd,0.09);
    if(G.peckAnim>=1) G.peckAnim=0;
  }
  G.comboPop = Math.max(0,G.comboPop-dt*5);
  G.exprTimer=Math.max(0,G.exprTimer-dt);

  // expression resolution
  var expr = G.exprTimer>0 ? G.expr : 'idle';
  // random derp moment when idle and no target pressing
  if(expr==='idle' && G.state==='play' && chance(0.004)){
    G.expr=pick(['derp','sneeze','wink']); G.exprTimer=rnd(0.5,1.1);
    expr=G.expr;
  }
  var nt = G.state==='play' ? nearestTarget() : null;
  if(expr==='idle' && nt){
    if(G.combo>=30 && nt.d<0.55) expr='panic';
    else if(nt.d<1.2) expr='focus';
  }
  var stareT=0;
  if(G.state==='fail'){
    var ft=(performance.now()-G.failAt)/1000;
    if(ft<0.4) expr='shock'; else expr='dead';
    stareT=easeOutCubic(clamp(ft/1.1,0,1));
    G.stareHead=stareT;
  }
  if(G.state==='title'||G.state==='over') expr = G.exprTimer>0?G.expr:'idle';

  // look direction
  var lookX=0, lookY=0;
  if(nt){
    var pp=targetPos(nt.t);
    lookX=clamp((pp.x-cx)/200,-1,1)*3.5;
    lookY=clamp((pp.y-cy)/200,-1,1)*3.5;
  }
  if(G.state==='fail') lookY=5*stareT; // slowly stares DOWN at the player
  if(G.state==='over') lookY=5;
  if(G.blink>0){ lookX*=0.3; lookY*=0.3; }

  // flight hover
  var flyY=0, wingFlap=0;
  if(bFly){
    flyY = -34 + Math.sin(G.beatClock*TAU)*12;
    wingFlap = Math.sin(t*0.04*(1+G.combo*0.01))*0.9;
  }
  // ground shadow
  var shA = bFly?0.12:0.32, shS = bFly?0.7:1;
  ctx.save();
  ctx.globalAlpha=shA; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,792,70*shS,14*shS,0,0,TAU); ctx.fill();
  ctx.restore();

  // peck lunge
  var lunge=0;
  if(G.peckAnim>0){
    var pa=G.peckAnim;
    lunge = pa<0.35 ? easeOutCubic(pa/0.35) : 1-easeOutCubic((pa-0.35)/0.65);
  }

  // body transform
  var breathe = 1+Math.sin(G.breatheT*2.2)*0.015;
  var squash = 1;
  if(G.peckAnim>0 && G.peckHit){
    squash = 1 + Math.sin(G.peckAnim*Math.PI)*0.12;
  }
  var pop = 1+G.comboPop*0.18;
  var eventScale = (eventActive() && G.event.type==='bigbird') ? 1.22 : 1;
  var sx = breathe*(2-squash)*pop*eventScale;
  var sy = breathe*squash*pop*eventScale;

  var spinAng=0;
  if(bSpin){
    spinAng = G.beatClock* (bRave?TAU*0.55:TAU*0.28);
  }
  if(bRave && !bSpin){
    // dance pops handled below
  }
  var danceX=0, danceY=0, danceTilt=0;
  if(bRave){
    var db=G.beatClock*2;
    danceX=Math.sin(db)*14;
    danceY=-Math.abs(Math.sin(db))*16;
    danceTilt=Math.sin(db)*0.18;
  }

  var px2=cx+danceX, py2=cy+flyY+danceY;

  ctx.save();
  ctx.translate(px2,py2);

  // afterimages while spinning / raving
  if((bSpin||bRave)){
    for(var gi=1;gi<=3;gi++){
      ctx.save();
      ctx.globalAlpha=0.1;
      ctx.rotate(spinAng - gi*0.28);
      ctx.scale(sx,sy);
      pigeonBody(0,0,t,{ghost:true,expr:expr,bFly:bFly,wingFlap:wingFlap,bRave:bRave,beat:G.beatClock});
      ctx.restore();
    }
  }

  ctx.rotate(spinAng + danceTilt + (bHeadbang?0:0));
  ctx.scale(sx,sy);

  // head: headbangs to the loop; on fail it slowly turns to face the player
  var bob = (bHeadbang?Math.sin(G.beatClock*TAU*2)*0.38:0)
          + (expr==='panic'?rnd(-0.05,0.05):0);
  var headAng = bob*(1-stareT) + lerp(-0.14,0,stareT);

  pigeonBody(0,0,t,{
    expr:expr, lookX:lookX, lookY:lookY, blink:G.blink>0,
    bShades:bShades, bFly:bFly, wingFlap:wingFlap, bRave:bRave,
    headAng:headAng, lunge:lunge, beat:G.beatClock, stare:stareT,
    bHeadbang:bHeadbang
  });
  ctx.restore();
}

function pigeonBody(x,y,t,o){
  var blue1='#8d98ad', blue2='#6f7b94', blue3='#5a657e', belly='#d4dcea';
  // tail feathers — fan of 5 for a fuller, fluffier look
  ctx.save();
  ctx.fillStyle=blue3;
  for(var i=-2;i<=2;i++){
    ctx.save(); ctx.translate(-46,10+i*11); ctx.rotate(0.5+i*0.18);
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-7,-24,14,36,7) : rr(ctx,-7,-24,14,36,7);
    ctx.fill();
    // central shaft + sheen
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(0,8); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.moveTo(-2.6,-16); ctx.lineTo(-2.6,4); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // back wing (flaps in flight / points up in rave)
  ctx.save();
  ctx.translate(8,6);
  var wingA = o.bFly ? -1.2 - o.wingFlap*0.7 : (o.bRave ? -2.2+Math.sin(o.beat*TAU*2)*0.2 : 0.15);
  ctx.rotate(wingA);
  ctx.fillStyle=blue3;
  ctx.beginPath(); ctx.ellipse(-40,-6,34,16,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(40,48,68,0.22)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-48,-10,14,6,0,0,TAU); ctx.fill();
  // feather tips
  ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  for(var wfi=-1;wfi<=1;wfi++){
    ctx.beginPath(); ctx.moveTo(-62+wfi*7,-10+Math.abs(wfi)*3);
    ctx.quadraticCurveTo(-70,-2+wfi,-64,6+Math.abs(wfi)*2); ctx.stroke();
  }
  ctx.restore();

  // body
  var bg2=ctx.createLinearGradient(0,-70,0,80);
  bg2.addColorStop(0,blue1); bg2.addColorStop(1,blue2);
  ctx.fillStyle=o.ghost?blue2:bg2;
  ctx.beginPath(); ctx.ellipse(0,14,56,60,0,0,TAU); ctx.fill();
  // downy back-feather scallops
  ctx.strokeStyle='rgba(0,0,0,0.10)'; ctx.lineWidth=2; ctx.lineCap='round';
  for(var sf=-3;sf<=3;sf++){
    var sfa=Math.PI*0.78+sf*0.16;
    var sx1=Math.cos(sfa)*52, sy1=14+Math.sin(sfa)*56;
    ctx.beginPath(); ctx.moveTo(sx1,sy1);
    ctx.quadraticCurveTo(sx1*0.82,sy1-6,sx1*0.7,sy1+2); ctx.stroke();
  }
  // belly
  ctx.fillStyle=belly;
  ctx.beginPath(); ctx.ellipse(6,34,34,32,0,0,TAU); ctx.fill();
  // belly underside shade
  var bsh=ctx.createRadialGradient(6,58,4,6,58,34);
  bsh.addColorStop(0,'rgba(70,80,110,0.28)'); bsh.addColorStop(1,'rgba(70,80,110,0)');
  ctx.fillStyle=bsh;
  ctx.beginPath(); ctx.ellipse(6,58,30,16,0,0,TAU); ctx.fill();
  // chest feather rows — soft scalloped lines across the belly
  ctx.strokeStyle='rgba(90,101,126,0.14)'; ctx.lineWidth=1.8; ctx.lineCap='round';
  for(var cf=0;cf<5;cf++){
    var cfY=18+cf*8;
    ctx.beginPath();
    for(var cfX=-22;cfX<=22;cfX+=11){
      ctx.moveTo(cfX,cfY);
      ctx.quadraticCurveTo(cfX+5.5,cfY-3,cfX+11,cfY);
    }
    ctx.stroke();
  }
  // subtle body outline for cleaner silhouette
  ctx.strokeStyle='rgba(40,48,68,0.22)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(0,14,56,60,0,0,TAU); ctx.stroke();
  // iridescent neck patch
  var ir=ctx.createLinearGradient(-20,-40,20,10);
  ir.addColorStop(0,'#27c99a'); ir.addColorStop(0.5,'#3b82d6'); ir.addColorStop(1,'#8a5cf0');
  ctx.fillStyle=ir;
  ctx.beginPath(); ctx.ellipse(4,-18,26,24,0.2,0,TAU); ctx.fill();
  // oil-slick shimmer sparkles
  ctx.fillStyle='rgba(255,255,255,'+(0.25+0.15*Math.sin(t*0.006))+')';
  [[-8,-30],[12,-22],[-2,-10]].forEach(function(p){
    ctx.beginPath(); ctx.arc(p[0],p[1],1.6,0,TAU); ctx.fill();
  });

  // feet
  ctx.strokeStyle='#ff8a1e'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-16,66); ctx.lineTo(-16,80); ctx.moveTo(18,66); ctx.lineTo(18,80); ctx.stroke();
  // ankle joints
  ctx.fillStyle='#d96f12';
  ctx.beginPath(); ctx.arc(-16,68,4,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(18,68,4,0,TAU); ctx.fill();
  ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-16,80); ctx.lineTo(-28,80); ctx.moveTo(-16,80); ctx.lineTo(-6,80);
  ctx.moveTo(18,80); ctx.lineTo(6,80); ctx.moveTo(18,80); ctx.lineTo(30,80); ctx.stroke();
  // tiny claws
  ctx.strokeStyle='#d96f12'; ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.moveTo(-28,80); ctx.lineTo(-31,83); ctx.moveTo(30,80); ctx.lineTo(33,83);
  ctx.moveTo(-6,80); ctx.lineTo(-6,83); ctx.moveTo(6,80); ctx.lineTo(6,83); ctx.stroke();

  // front wing
  ctx.save();
  ctx.translate(4,12);
  if(o.bFly){ ctx.rotate(1.2+o.wingFlap*0.7); }
  ctx.fillStyle=blue2;
  ctx.beginPath(); ctx.ellipse(30,-2,30,15,-0.2,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(40,48,68,0.22)'; ctx.lineWidth=2; ctx.stroke();
  // feather layer lines + gloss
  ctx.strokeStyle='rgba(0,0,0,0.16)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  for(var fw2=-1;fw2<=1;fw2++){
    ctx.beginPath(); ctx.moveTo(16+fw2*6,-8+Math.abs(fw2)*3);
    ctx.quadraticCurveTo(40+fw2*4,-2+fw2,48,4+Math.abs(fw2)*2); ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(22,-7,13,4,-0.2,0,TAU); ctx.fill();
  ctx.restore();

  /* ---- head group ---- */
  ctx.save();
  var hy = -58 - o.lunge*96;
  var hx = 0;
  ctx.translate(hx,hy);
  ctx.rotate(o.headAng + (o.lunge? -0.15*o.lunge:0));
  if(o.lunge>0) ctx.scale(1+o.lunge*0.12,1.08);

  // tuft
  ctx.strokeStyle=blue3; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-6,-40); ctx.quadraticCurveTo(-14,-54,-4,-58);
  ctx.moveTo(2,-42); ctx.quadraticCurveTo(4,-58,12,-54);
  ctx.stroke();

  // head
  ctx.fillStyle=o.ghost?blue2:blue1;
  ctx.beginPath(); ctx.arc(0,0,40,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(-10,-12,18,0,TAU); ctx.fill();
  // subtle head outline + lower-head shadow
  ctx.strokeStyle='rgba(40,48,68,0.22)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,0,40,0,TAU); ctx.stroke();
  ctx.fillStyle='rgba(60,70,95,0.18)';
  ctx.beginPath(); ctx.ellipse(0,22,30,10,0,0,TAU); ctx.fill();

  // blush cheeks — stronger on happy/smug/money/derp
  if(o.expr!=='shock' && o.expr!=='dead'){
    var blushA = 0.25;
    if(o.expr==='happy'||o.expr==='money'||o.expr==='smug'||o.expr==='derp') blushA=0.55;
    var blg=ctx.createRadialGradient(0,0,1,0,0,9);
    blg.addColorStop(0,'rgba(255,120,140,'+blushA+')');
    blg.addColorStop(1,'rgba(255,120,140,0)');
    ctx.fillStyle=blg;
    ctx.beginPath(); ctx.arc(-25,11,9,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(25,11,9,0,TAU); ctx.fill();
  }

  // eyes
  var eL={x:-16,y:-4}, eR={x:16,y:-4};
  drawEye(eL.x,eL.y,o,-1);
  drawEye(eR.x,eR.y,o,1);

  // sunglasses (combo >= 30) — hidden for shock/wow/money so the eyes read
  if(o.bShades && o.expr!=='shock' && o.expr!=='wow' && o.expr!=='money'){
    ctx.save();
    ctx.fillStyle='#11131c';
    rr(ctx,-34,-18,30,20,6); ctx.fill();
    rr(ctx,4,-18,30,20,6); ctx.fill();
    ctx.fillRect(-4,-10,8,3);
    var sh=ctx.createLinearGradient(0,-18,0,2);
    sh.addColorStop(0,'rgba(255,255,255,0.55)'); sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sh;
    rr(ctx,-31,-15,24,8,4); ctx.fill();
    rr(ctx,7,-15,24,8,4); ctx.fill();
    ctx.restore();
  }

  // beak — points UP toward the snacks; opens on peck / caw
  var open=0;
  if(o.lunge>0.2) open=Math.sin(clamp((o.lunge-0.2)/0.8,0,1)*Math.PI)*0.5;
  if(o.expr==='wow'||o.expr==='shock') open=0.55;
  if(o.expr==='derp'||o.expr==='money'||o.expr==='sneeze') open=0.4;
  if(o.expr==='dead' && o.stare>0.6) open=0.2;
  ctx.save();
  // beak outline color
  var bo='#c96a12';
  // mouth interior (dark) visible when beak opens
  if(open>0.02){
    ctx.fillStyle='#3a1f12';
    ctx.beginPath();
    ctx.moveTo(-6,2); ctx.lineTo(0,-28-open*8); ctx.lineTo(6,2);
    ctx.quadraticCurveTo(3,4+open*6,0,4+open*6);
    ctx.quadraticCurveTo(-3,4+open*6,-6,2); ctx.closePath(); ctx.fill();
  }
  // upper beak
  ctx.fillStyle='#ff9420';
  ctx.beginPath();
  ctx.moveTo(-9,4); ctx.lineTo(0,-30-open*8); ctx.lineTo(9,4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=bo; ctx.lineWidth=1.6; ctx.stroke();
  ctx.fillStyle='#e07a12';
  ctx.beginPath();
  ctx.moveTo(-9,4); ctx.lineTo(0,-30-open*8); ctx.lineTo(2,4); ctx.closePath(); ctx.fill();
  // beak sheen
  ctx.strokeStyle='rgba(255,210,150,0.7)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-5,-2); ctx.lineTo(-1.5,-20-open*5); ctx.stroke();
  // lower beak
  ctx.fillStyle='#ff8a1e';
  ctx.save(); ctx.translate(0,4); ctx.rotate(open*0.7);
  ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(0,12); ctx.lineTo(7,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=bo; ctx.lineWidth=1.6; ctx.stroke();
  ctx.restore();
  // nostril
  ctx.fillStyle='#b35c0d'; ctx.beginPath(); ctx.arc(-2,-8,1.6,0,TAU); ctx.fill();
  ctx.restore();

  // tongue (out on happy/derp/money/dead)
  if((o.expr==='happy'||o.expr==='derp'||o.expr==='money'||(o.expr==='dead'&&o.stare>0.5)) && open>0.18){
    ctx.save();
    ctx.fillStyle='#ff6b8a';
    ctx.beginPath();
    ctx.ellipse(0, 10+open*4, 5, 7+open*3, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // expression extras
  if(o.expr==='wow'){
    ctx.strokeStyle='#fff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(30,-44); ctx.lineTo(42,-60); ctx.moveTo(36,-40); ctx.lineTo(42,-60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30,-44); ctx.lineTo(-42,-60); ctx.moveTo(-36,-40); ctx.lineTo(-42,-60); ctx.stroke();
    // sparkle stars
    ctx.fillStyle='#ffe66b';
    for(var sp=0;sp<3;sp++){
      var sa=t*0.01+sp*2.1, sr=46+Math.sin(sa)*4;
      ctx.beginPath(); ctx.arc(Math.cos(sa)*sr, -50+Math.sin(sa)*8, 2.5, 0, TAU); ctx.fill();
    }
  }
  if(o.expr==='money'){
    // floating dollar signs
    ctx.fillStyle='#ffe66b'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
    var ds=t*0.05;
    ctx.fillText('$', 34, -46-Math.sin(ds)*4);
    ctx.fillText('$', -34, -42-Math.sin(ds+1)*4);
    ctx.fillText('$', 0, -60-Math.sin(ds+2)*4);
  }
  if(o.expr==='panic'){
    ctx.fillStyle='#7ad7ff';
    ctx.beginPath(); ctx.arc(30,-16,4,0,Math.PI*1.5); ctx.lineTo(30,-28); ctx.fill();
    ctx.beginPath(); ctx.arc(-28,-12,3.5,0,Math.PI*1.5); ctx.lineTo(-28,-22); ctx.fill();
  }
  if(o.expr==='sneeze'){
    // spray drops
    ctx.fillStyle='rgba(180,220,255,0.85)';
    for(var dr=0;dr<4;dr++){
      var dx=22+dr*7, dy=-6+Math.sin(t*0.04+dr)*4;
      ctx.beginPath(); ctx.arc(dx,dy,2.2,0,TAU); ctx.fill();
    }
  }
  if(o.expr==='dead' && o.stare>0.5){
    // stink lines of judgment
    ctx.strokeStyle='rgba(140,255,140,0.8)'; ctx.lineWidth=3;
    for(var sl2=-1;sl2<=1;sl2+=2){
      ctx.beginPath();
      ctx.moveTo(sl2*30,-36);
      ctx.quadraticCurveTo(sl2*40+Math.sin(t*0.01)*6,-52,sl2*30,-68);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEye(ex,ey,o,side){
  var E='#23262f';
  // wink: only the right eye (side===1) closes
  if(o.expr==='wink' && side===1){
    ctx.strokeStyle=E; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(ex,ey+2,7,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    return;
  }
  if(o.blink || o.expr==='happy'){
    ctx.strokeStyle=E; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(ex,ey+2,7,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    return;
  }
  // X eyes for dead
  if(o.expr==='dead'){
    ctx.strokeStyle=E; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(ex-6,ey-6); ctx.lineTo(ex+6,ey+6);
    ctx.moveTo(ex+6,ey-6); ctx.lineTo(ex-6,ey+6);
    ctx.stroke();
    return;
  }
  // dollar sign eyes for money
  if(o.expr==='money'){
    ctx.fillStyle='#ffe66b';
    ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('$', ex, ey+1);
    return;
  }
  // crossed eyes for derp
  var derpLook = (o.expr==='derp') ? (side===1 ? -6 : 6) : 0;
  // eye white with subtle dark outline
  ctx.fillStyle='#f2f5fb';
  ctx.beginPath(); ctx.ellipse(ex,ey,8.5,9,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(40,48,68,0.25)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.ellipse(ex,ey,8.5,9,0,0,TAU); ctx.stroke();
  var pup=4.5;
  if(o.expr==='shock'){ pup=3; ctx.fillStyle='#f2f5fb'; ctx.beginPath(); ctx.ellipse(ex,ey,11,12,0,0,TAU); ctx.fill(); ctx.stroke(); }
  if(o.expr==='sneeze'){ pup=2.2; }
  var lx = derpLook || o.lookX, ly = o.lookY;
  if(!o.bShades || o.expr==='shock'){
    // iris ring (warm brown) around pupil for more lifelike eyes
    ctx.fillStyle='#6b4a2b';
    ctx.beginPath(); ctx.arc(ex+lx,ey+ly,pup+1.3,0,TAU); ctx.fill();
    ctx.fillStyle='#1b1e26';
    ctx.beginPath(); ctx.arc(ex+lx,ey+ly,pup,0,TAU); ctx.fill();
    // double catchlights
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(ex+lx-1.4,ey+ly-1.6,pup*0.35,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+lx+1.6,ey+ly+1.2,pup*0.18,0,TAU); ctx.fill();
  }
  // lid / brow — curved arc instead of straight line for more expression
  ctx.strokeStyle=E; ctx.lineWidth=4.5; ctx.lineCap='round';
  var browY=ey-11, tilt=0;
  if(o.expr==='focus'){ tilt=side*0.18; }
  if(o.expr==='panic'){ tilt=-side*0.3; browY=ey-14; }
  if(o.expr==='shock'){ tilt=-side*0.35; browY=ey-15; }
  if(o.expr==='smug'){ tilt=side*0.4; browY=ey-9; }
  if(o.expr==='sneeze'){ tilt=side*0.5; browY=ey-8; }
  if(o.expr==='dead'){ tilt=-side*0.12*o.stare; browY=lerp(ey-11,ey-15,o.stare||0); }
  if(o.expr==='idle'){ tilt=side*0.22; }
  if(o.expr==='wow'){ tilt=-side*0.12; browY=ey-14; }
  ctx.save(); ctx.translate(ex,browY); ctx.rotate(tilt);
  ctx.beginPath();
  if(o.expr==='panic'||o.expr==='shock'){
    // worried / raised inner-brow curve
    ctx.moveTo(-9,2); ctx.quadraticCurveTo(0,-3,9,2);
  } else if(o.expr==='smug'||o.expr==='sneeze'){
    // smug lowered curve
    ctx.moveTo(-9,-1); ctx.quadraticCurveTo(0,2,9,-1);
  } else {
    // neutral gentle arch
    ctx.moveTo(-9,1); ctx.quadraticCurveTo(0,-2,9,1);
  }
  ctx.stroke();
  ctx.restore();
  // half lid for idle / smug / sneeze
  if(o.expr==='idle'||o.expr==='smug'||o.expr==='sneeze'){
    ctx.fillStyle='#8d98ad';
    var lidA = o.expr==='smug'?0.5 : o.expr==='sneeze'?0.6 : 0.3;
    ctx.beginPath(); ctx.ellipse(ex,ey,8.5,9,0,Math.PI*1.05,Math.PI*1.95);
    ctx.lineTo(ex+8.5,ey-9*lidA); ctx.closePath(); ctx.fill();
  }
}

/* ============================================================
   PLATFORM
   ============================================================ */
function drawPlatform(t){
  var sc=SCENES[sceneIdx];
  var wobX=0, wobY=0;
  if(eventActive() && G.event.type==='wobble'){
    var p=eventP();
    wobX=Math.sin(p*TAU*4)*10; wobY=Math.cos(p*TAU*3)*5;
  }
  var cx=DISC.x+wobX, cy=DISC.y+wobY;

  // base shadow
  ctx.save();
  ctx.globalAlpha=0.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,cy+12,DISC.R+14,DISC.R+14,0,0,TAU); ctx.fill();
  ctx.restore();

  // disc
  var dg=ctx.createRadialGradient(cx-40,cy-50,20,cx,cy,DISC.R+20);
  dg.addColorStop(0,sc.disc[0]); dg.addColorStop(1,sc.disc[1]);
  ctx.fillStyle=dg;
  ctx.beginPath(); ctx.arc(cx,cy,DISC.R,0,TAU); ctx.fill();
  ctx.lineWidth=12; ctx.strokeStyle=sc.rim;
  ctx.beginPath(); ctx.arc(cx,cy,DISC.R-2,0,TAU); ctx.stroke();
  // rim bevel highlights (outer light edge / inner dark edge)
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,DISC.R-6,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.arc(cx,cy,DISC.R-9,0,TAU); ctx.stroke();
  ctx.restore();

  // rotating tick pattern
  var rot=G.beatClock*(TAU/8);
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(-rot);
  var checker = sceneIdx===2;
  for(var i=0;i<24;i++){
    var a0=i*TAU/24, a1=(i+0.6)*TAU/24;
    ctx.beginPath();
    ctx.arc(0,0,DISC.R-14,a0,a1); ctx.arc(0,0,DISC.R-44,a1,a0,true); ctx.closePath();
    if(checker){
      ctx.fillStyle=i%2? 'rgba(255,210,63,0.5)':'rgba(255,79,154,0.5)';
    }else{
      ctx.fillStyle=i%2? 'rgba(255,255,255,0.10)':'rgba(0,0,0,0.10)';
    }
    ctx.fill();
  }
  // spokes
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=3;
  for(var s3=0;s3<8;s3++){
    ctx.save(); ctx.rotate(s3*TAU/8);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-DISC.R+14); ctx.stroke();
    ctx.restore();
  }
  // rim rivets — small bolts that rotate with the platter
  for(var rv=0;rv<12;rv++){
    var ra2=rv*TAU/12, rr0=DISC.R-8;
    ctx.save(); ctx.translate(Math.cos(ra2)*rr0,Math.sin(ra2)*rr0);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(0.6,1,2.6,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.30)';
    ctx.beginPath(); ctx.arc(0,0,2.4,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // soft inner shadow ring + top-left gloss sheen
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,DISC.R-6,0,TAU); ctx.clip();
  var isg=ctx.createRadialGradient(cx,cy,DISC.R-40,cx,cy,DISC.R-6);
  isg.addColorStop(0,'rgba(0,0,0,0)'); isg.addColorStop(1,'rgba(0,0,0,0.16)');
  ctx.fillStyle=isg; ctx.fillRect(cx-DISC.R,cy-DISC.R,DISC.R*2,DISC.R*2);
  var sheen=ctx.createRadialGradient(cx-52,cy-64,6,cx-52,cy-64,96);
  sheen.addColorStop(0,'rgba(255,255,255,0.16)'); sheen.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sheen; ctx.beginPath(); ctx.arc(cx-52,cy-64,96,0,TAU); ctx.fill();
  ctx.restore();

  // hub — recessed collar + screw
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.arc(cx,cy,17,0,TAU); ctx.fill();
  ctx.fillStyle=sc.rim;
  ctx.beginPath(); ctx.arc(cx,cy,14,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,14,0,TAU); ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.arc(cx,cy,5.5,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(cx-3,cy-4,4,0,TAU); ctx.fill();

  // peck zone marker (bottom arc) — reacts LIVE to the incoming snack
  var beatFrac = G.beatClock%1;
  var w=goodWindow();
  // timing state of the nearest incoming snack
  var nz = (G.state==='play')?nearestTarget():null;
  var ad = nz?Math.abs(nz.d):99;
  var nearFood = nz && nz.t.kind==='food';
  var inGood  = nearFood && ad<=w;
  var inPerfect = nearFood && ad<=0.13;
  var nearBad = nz && nz.t.kind==='bad' && nz.d>-0.7 && nz.d<0.7;
  var nearEmpty = nz && nz.t.kind==='empty' && ad<=w*1.6;
  // 0 far away -> 1 dead on the beat
  var heat = nearFood ? clamp(1-ad/(w*2.4),0,1) : 0;
  var idlePulse = (G.state!=='play') ? Math.max(0,1-beatFrac*3.5) : 0;
  var zoneCol = nearBad ? '#c45bff' : inPerfect ? '#d3ff5b' : inGood ? '#ffd23f' : sc.ring;
  var glow = 8 + 20*heat + 10*idlePulse;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.lineCap='round';
  // GOOD window arc (brightens + warms as the snack closes in)
  ctx.strokeStyle=zoneCol;
  ctx.globalAlpha = G.state==='play' ? (0.35+0.65*Math.max(heat,nearBad?0.7:0)) : 1;
  ctx.shadowColor=zoneCol; ctx.shadowBlur=glow;
  ctx.lineWidth=10;
  ctx.beginPath(); ctx.arc(0,0,DISC.R-6,Math.PI/2 - w,Math.PI/2 + w); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
  // PERFECT inner arc — green flash in the perfect pocket
  var pCol = inPerfect ? '#eaff9a' : 'rgba(255,255,255,'+(0.4+0.5*idlePulse)+')';
  ctx.strokeStyle=pCol; ctx.lineWidth= inPerfect?5:3;
  if(inPerfect){ ctx.shadowColor='#d3ff5b'; ctx.shadowBlur=16; }
  ctx.beginPath(); ctx.arc(0,0,DISC.R-6,Math.PI/2-0.13,Math.PI/2+0.13); ctx.stroke();
  ctx.shadowBlur=0;

  // fixed target ring at the exact peck point (sync ring shrinks onto this)
  if(G.state==='play'){
    var ringCol = nearBad ? '#c45bff' : nearEmpty ? 'rgba(255,255,255,0.5)' : inPerfect ? '#d3ff5b' : inGood ? '#ffd23f' : '#ffffff';
    ctx.save();
    ctx.translate(0,DISC.R-30);
    ctx.globalAlpha = nearEmpty?0.35:(inPerfect?1:inGood?0.85:0.28);
    ctx.strokeStyle=ringCol; ctx.lineWidth= inPerfect?4:3;
    ctx.shadowColor=ringCol; ctx.shadowBlur=inPerfect?18:inGood?10:0;
    ctx.beginPath(); ctx.arc(0,0,30,0,TAU); ctx.stroke();
    if(nearBad){ // X marks the vegetable: DO NOT PECK
      ctx.globalAlpha=0.9; ctx.strokeStyle='#e3b6ff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(-9,-9); ctx.lineTo(9,9); ctx.moveTo(9,-9); ctx.lineTo(-9,9); ctx.stroke();
    }
    ctx.restore();
  }

  // arrow — pops bigger the tighter the timing, purple warning for veggies
  var arrS = nearBad?1.12 : inPerfect?1.42 : inGood?1.18 : 1;
  ctx.save();
  ctx.translate(0,DISC.R+17);
  ctx.scale(arrS,arrS);
  ctx.fillStyle=zoneCol;
  if(inPerfect||nearBad){ ctx.shadowColor=zoneCol; ctx.shadowBlur=16; }
  ctx.beginPath();
  ctx.moveTo(0,9); ctx.lineTo(-12,-9); ctx.lineTo(12,-9);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();

  return {x:cx,y:cy};
}

function drawTargets(){
  var tiny = (eventActive() && G.event.type==='tinysnack') ? 0.78 : 1;
  var ww = goodWindow();
  var ntNear = (G.state==='play') ? nearestTarget() : null;
  for(var i=0;i<G.targets.length;i++){
    var tg=G.targets[i];
    if(tg.gone) continue;
    var d=tg.beat-G.beatClock;
    if(d>7.2 || d<-1.4) continue;
    // fade in over the far approach, fade out after passing — keeps lanes uncluttered
    var aIn  = d>6 ? clamp((7.2-d)/1.2,0,1) : 1;
    var aOut = d<0 ? clamp((d+1.4)/1.0,0,1) : 1;
    var tAlpha = aIn*aOut;
    var step=TAU/8;
    var ang=Math.PI/2+d*step;
    var wob=(eventActive()&&G.event.type==='wobble')?Math.sin(G.beatClock*TAU*2+i)*3:0;
    var r=DISC.R-30;
    var x=DISC.x+wob+Math.cos(ang)*r, y=DISC.y+Math.sin(ang)*r;
    var bob=Math.sin(G.beatClock*TAU*2+i)*2;
    var cy2=y+bob+wob;
    ctx.save();
    ctx.globalAlpha=tAlpha;
    // rhythm-game sync ring on the NEAREST incoming item: shrinks onto the lane ring
    if(ntNear && ntNear.t===tg && d>0 && d<1.2){
      var rr=30+d*30;
      var rc, rw=3, rb=6;
      if(tg.kind==='bad'){ rc='#c45bff'; rw=3; rb=10; }
      else if(tg.kind==='food'){
        if(d<=0.13){ rc='#d3ff5b'; rw=4; rb=16; }
        else if(d<=ww){ rc='#ffd23f'; rw=4; rb=10; }
        else { rc='rgba(255,255,255,0.75)'; }
        ctx.save();
        ctx.strokeStyle=rc; ctx.lineWidth=rw; ctx.shadowColor=rc; ctx.shadowBlur=rb;
        ctx.beginPath(); ctx.arc(x,cy2,rr,0,TAU); ctx.stroke();
        ctx.restore();
      }
      if(tg.kind==='bad'){
        ctx.save();
        ctx.strokeStyle=rc; ctx.lineWidth=rw; ctx.shadowColor=rc; ctx.shadowBlur=rb;
        ctx.setLineDash([6,5]);
        ctx.beginPath(); ctx.arc(x,cy2,rr,0,TAU); ctx.stroke();
        ctx.restore();
      }
    }
    if(tg.kind==='empty'){
      // dashed ghost slot marker
      ctx.save(); ctx.globalAlpha=0.25*tAlpha;
      ctx.strokeStyle='#ffffff'; ctx.setLineDash([4,5]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,cy2,12,0,TAU); ctx.stroke();
      ctx.restore();
      ctx.restore();
      continue;
    }
    var spr=sprites[tg.food];
    var scale = d<0? clamp(1+d,0.2,1) : 1; // shrink as it passes away
    if(tg.kind==='bad'){
      // warning aura
      var fl=0.5+0.5*Math.sin(G.beatClock*TAU*4);
      ctx.save();
      ctx.strokeStyle='rgba(170,80,255,'+((0.4+0.4*fl)*tAlpha)+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(x,cy2,26,0,TAU); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(x,cy2);
    ctx.rotate(Math.sin(G.beatClock*TAU+i)*0.12 + (tg.kind==='bad'?Math.sin(G.beatClock*TAU*6)*0.2:0));
    var sc2=0.62*scale*tiny;
    // soft drop shadow on the disc surface
    ctx.save();
    ctx.rotate(-(Math.sin(G.beatClock*TAU+i)*0.12 + (tg.kind==='bad'?Math.sin(G.beatClock*TAU*6)*0.2:0)));
    ctx.globalAlpha=0.22*tAlpha;
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(2,18*sc2,20*sc2,7*sc2,0,0,TAU); ctx.fill();
    ctx.restore();
    ctx.drawImage(spr,-36*sc2,-36*sc2,72*sc2,72*sc2);
    ctx.restore();
    ctx.restore();
  }
}

   HUD / BANNERS / TITLE / GAME OVER

function outlinedText(txt,x,y,size,fill,stroke,align,rot){
  ctx.save();
  ctx.translate(x,y); if(rot) ctx.rotate(rot);
  ctx.font='900 '+size+'px "Arial Black", Impact, sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=size*0.18;
  ctx.strokeStyle=stroke||'#141420';
  ctx.strokeText(txt,0,0);
  ctx.fillStyle=fill||'#fff';
  ctx.fillText(txt,0,0);
  ctx.restore();
}
function smallText(txt,x,y,size,color,align,alpha){
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.font='800 '+size+'px "Arial Black", Impact, sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillStyle=color; ctx.fillText(txt,x,y);
  ctx.restore();
}

function drawHUD(t){
  // best + scene
  smallText('BEST x'+Math.max(G.best,G.combo),20,26,15,'rgba(255,255,255,0.75)','left');
  smallText(SCENES[sceneIdx].name,VW-20,26,13,SCENES[sceneIdx].accent,'right',0.9);

  if(G.combo>=2 && G.state==='play'){
    var pop=1+G.comboPop*0.4;
    var col = G.combo>=100?'#b6ff2e':G.combo>=50?'#ffd23f':G.combo>=20?'#ff6fb8':'#ffffff';
    ctx.save();
    ctx.translate(210,108); ctx.scale(pop,pop);
    outlinedText('x'+G.combo,0,0,54,col,'#141420');
    smallText('COMBO',0,34,14,'rgba(255,255,255,0.85)');
    ctx.restore();
  }

  // first-beats hint
  if(G.state==='play' && G.beatClock<7){
    var a=0.5+0.5*Math.sin(t*0.008);
    smallText('TAP WHEN THE SNACK HITS THE ARROW',210,250,15,'rgba(255,255,255,'+(0.55+0.4*a)+')');
  }
}

function drawBanner(){
  if(!G.banner) return;
  var b=G.banner;
  b.t-=1/60;
  var p=1-b.t/b.max;
  if(b.t<=0){ G.banner=null; return; }
  var sc=0.55+0.45*easeOutBack(clamp(p*3,0,1));
  var a = b.t<0.4? b.t/0.4:1;
  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(210,300);
  ctx.scale(sc*(1+Math.sin(p*TAU)*0.02),sc);
  outlinedText(b.title,0,0,40,'#ffe98a','#141420');
  smallText(b.sub,0,34,14,'#fff');
  ctx.restore();
}

function drawEventBanner(){
  if(!eventActive()) return;
  var ev=G.event, p=eventP();
  var a = p<0.12? p/0.12 : p>0.8? (1-p)/0.2 : 1;
  ctx.save();
  ctx.globalAlpha=a*0.95;
  var wob2=Math.sin(G.beatClock*TAU*2)*3;
  outlinedText(ev.label,210,190+wob2,24,'#ff5a5a','#141420',null,Math.sin(G.beatClock*TAU)*0.04);
  ctx.restore();
}
function eventActive(){
  return G.event && G.beatClock>=G.event.start && G.beatClock<=G.event.start+8;
}
function eventP(){
  if(!eventActive()) return 0;
  return clamp((G.beatClock-G.event.start)/8,0,1);
}

function drawJudge(){
  if(judgeFX.t<=0) return;
  var p=1-judgeFX.t/judgeFX.max;           // 0..1 age
  var a = p<0.12? p/0.12 : clamp(judgeFX.t/0.28,0,1);
  var sc = 0.55 + 0.55*easeOutBack(clamp(p*4.5,0,1));
  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(210,468);
  ctx.scale(sc,sc);
  outlinedText(judgeFX.txt,0,0,30,judgeFX.col,'#141420');
  ctx.restore();
}
function drawTextsWaves(){
  drawJudge();
  for(var i=0;i<waves.length;i++){
    var wv=waves[i];
    ctx.save();
    ctx.globalAlpha=wv.life/wv.max;
    ctx.strokeStyle=wv.color; ctx.lineWidth=wv.w;
    ctx.beginPath(); ctx.arc(wv.x,wv.y,wv.r,0,TAU); ctx.stroke();
    ctx.restore();
  }
  for(var j=0;j<texts.length;j++){
    var tx=texts[j];
    ctx.save(); ctx.globalAlpha=clamp(tx.life/tx.max,0,1);
    outlinedText(tx.str,tx.x,tx.y,tx.size,tx.color,'#141420','center',tx.rot);
    ctx.restore();
  }
}

function drawOver(t){

  ctx.fillStyle='#05050c'; ctx.fillRect(-300,-220,600,460);

  smallText(G.failReason,0,-42,12,'rgba(255,255,255,0.8)');

  smallText('BEST x'+G.best+'   ·   '+G.runLen.toFixed(1)+'S OF CHAOS',0,62,13,'#57e3c4');
  if(G.combo>=G.best && G.combo>0) smallText('NEW BEST. THE PIGEON APPROVES.',0,88,10,'#ffe98a');
  var pulse2=0.6+0.4*Math.sin(t*0.008);
  ctx.save(); ctx.globalAlpha=pulse2;
  smallText('TAP TO GO AGAIN',0,112,16,'#fff');
  ctx.restore();
  ctx.restore();

  drawDots(0.95);
}


/* ============================================================
   MAIN UPDATE / RENDER
   ============================================================ */
var lastT=performance.now();
function bps(){ return currentBPM()/60; }
G.bps=104/60;

function update(dt){
  // freeze-frame (bullet time) for milestone hits
  if(G.freezeT>0){ dt *= 0.18; G.freezeT=Math.max(0,G.freezeT-dt*5); }
  G.bps = bps();
  if(G.state==='play'){
    G.beatClock += dt*bps();
    var bi=Math.floor(G.beatClock);
    if(bi!==G.lastBeatInt){ G.lastBeatInt=bi; G.beatPulse=1; }
    G.runLen=(performance.now()-G.runStart)/1000;
    fillQueue();
    // auto-pass / missed food
    var w=goodWindow();
    for(var i=0;i<G.targets.length;i++){
      var tg=G.targets[i];
      if(tg.gone) continue;
      var d=tg.beat-G.beatClock;
      if(d < -w){
        if(tg.kind==='food'){ tg.gone=true; failRun('THE SNACK ESCAPED. SHAME.'); return; }
        if(tg.kind==='bad'){
          tg.gone=true; G.score+=2;
          addText(DISC.x,DISC.y+DISC.R+50,'EW. DISCIPLINE.',14,'#8aff5b');
        }
      }
    }
    // random bar-synced meltdown events
    var bar=Math.floor(G.beatClock/8);
    if(G.beatClock>=24 && bar>G.lastEventBar && !G.event){
      G.lastEventBar=bar;
      if(chance(0.5)){
        var ev=pick(EVENTS);
        G.event={type:ev.type,label:ev.label,start:(bar+1)*8};
      }
    }
    if(G.event && G.beatClock>G.event.start+8){ G.event=null; }
    if(eventActive() && G.event.type==='snackrain' && chance(0.3)){
      pspawn({x:rnd(40,380),y:rnd(-40,200),vx:rnd(-20,20),vy:rnd(120,260),life:2,
        size:rnd(4,8),r:255,g:rnd(120,230),b:80,type:1,vr:rnd(-8,8),grav:200,z:1});
    }
    if(G.beatClock>7) G.hintBeats=false;
  }
  spawnAmbient(dt);
  pupdate(dt);
  fxUpdate(dt);
  G.shake=Math.max(0,G.shake-dt*22);
  G.zoomPunch=Math.max(0,G.zoomPunch-dt*2.2);
  G.flashT=Math.max(0,G.flashT-dt*2.6);
  G.beatPulse=Math.max(0,G.beatPulse-dt*5);
  G.speedLines=Math.max(0,G.speedLines-dt*1.5);
  G.derpT=Math.max(0,G.derpT-dt);
}

function render(t,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // letterbox base
  ctx.fillStyle=SCENES[sceneIdx].dark;
  ctx.fillRect(0,0,cssW,cssH);

  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(unit,unit);

  // ---- camera space: world only (zoom + shake never touch the HUD) ----
  ctx.save();
  // camera zoom around disc (plus beat thump)
  var z=1+G.zoomPunch + G.beatPulse*0.035;
  if(eventActive()&&G.event.type==='zoomies'){ var ep=eventP(); z*=1+0.07*Math.sin(ep*TAU*6); }
  ctx.translate(210,430);
  ctx.scale(z,z);
  ctx.translate(-210,-430);
  // shake
  if(G.shake>0.2) ctx.translate(rnd(-G.shake,G.shake)*0.6,rnd(-G.shake,G.shake)*0.6);

  // speed lines during high combo / on perfect bursts
  if(G.state==='play' && (G.speedLines>0.05 || G.combo>=30)){
    var slA = Math.max(G.speedLines, G.combo>=30?0.3:0) * (G.combo>=100?1:0.7);
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,'+(0.12*slA)+')';
    ctx.lineWidth=2; ctx.lineCap='round';
    for(var li=0; li<22; li++){
      var ang = (li/22)*TAU + (t*0.0008);
      var r1 = 150 + (li%3)*14;
      var r2 = r1 + 40 + G.combo*0.6;
      var px=210+Math.cos(ang)*r1, py=430+Math.sin(ang)*r1;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(210+Math.cos(ang)*r2, 430+Math.sin(ang)*r2); ctx.stroke();
    }
    ctx.restore();
  }

  drawScene(t);
  pdraw(0);

  // strobe event
  if(eventActive() && G.event.type==='strobe'){
    var f=Math.floor(G.beatClock*4)%2;
    ctx.fillStyle=f?'rgba(255,255,255,0.10)':'rgba(255,45,215,0.08)';
    ctx.fillRect(-40,-40,VW+80,VH+80);
  }

  drawPlatform(t);
  drawTargets();

  // pigeon position (slightly smaller and lower on the title screen)
  var pgY = 688, pgScale=1;
  if(G.state==='title'){ pgY=724; pgScale=0.9; }
  ctx.save();
  ctx.translate(210,pgY); ctx.scale(pgScale,pgScale); ctx.translate(-210,-pgY);
  drawPigeon(t,210,pgY,dt);
  ctx.restore();

  pdraw(1);
  drawTextsWaves();
  ctx.restore(); // leave camera space — overlays below stay fixed on screen

  if(G.state==='play'){
    drawHUD(t);
    drawEventBanner();
    drawBanner();
  }
  if(G.state==='fail'){
    drawFailFX(t);
  }
  if(G.state==='title') drawTitle(t);
  if(G.state==='over') drawOver(t);

  // screen flash overlay (perfect white / fail red / milestone gold)
  if(G.flashT>0){
    var fa = clamp(G.flashT,0,1) * 0.5;
    ctx.save();
    ctx.globalAlpha = fa;
    ctx.fillStyle = G.flashCol;
    ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }

  ctx.restore();
}

function drawFailFX(t){
  var ft=(performance.now()-G.failAt)/1000;
  // slow turn handled in pigeon via stare; timed BWARGH text
  if(ft>1.05 && ft<2.4){
    var a=clamp((ft-1.05)/0.15,0,1)*clamp((2.4-ft)/0.4,0,1);
    var wob2=Math.sin(t*0.05)*4;
    ctx.save(); ctx.globalAlpha=a;
    outlinedText('BWARGH!',210+wob2,610,46,'#ff6b6b','#141420',null,Math.sin(t*0.03)*0.08);
    ctx.restore();
  }
  smallText(G.failReason,210,560,14,'rgba(255,255,255,0.9)');
}

/* ---- loop with delta ---- */
function frame(now){
  var dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  // title demo clock handled inside drawTitle; normal updates otherwise
  if(G.state!=='title') update(dt);
  else { pupdate(dt); fxUpdate(dt); spawnAmbient(dt); G.shake=0; G.zoomPunch=Math.max(0,G.zoomPunch-dt*2.2); }
  render(now,dt);
  requestAnimationFrame(frame);
}

/* ============================================================
   INPUT WIRING
   ============================================================ */
function hitDots(vx){
  if(G.state==='play' && G.state!=='fail') return false;
  if(G.state==='fail') return false;
  for(var i=0;i<5;i++){
    var dx=vx.x-dotX(i), dy=vx.y-(dotsY()+8);
    if(dx*dx+dy*dy<26*26){ sceneIdx=i; try{localStorage.setItem('pcs_scene',String(i));}catch(e){} pclear(); sfxUi(); return true; }
  }
  return false;
}
canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var v=toVirtual(e.clientX,e.clientY);
  if(v.x<0||v.x>VW||v.y<0||v.y>VH){ /* outside play area still pecks */ }
  if(hitDots(v)) return;
  primaryAction();
}, {passive:false});

window.addEventListener('keydown', function(e){
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!e.repeat) primaryAction();
  }
  if(e.code>='Digit1'&&e.code<='Digit5'){
    var n=parseInt(e.code.slice(5),10)-1;
    if(G.state==='title'||G.state==='over'){ sceneIdx=n; pclear(); sfxUi(); }
  }
  if((e.code==='ArrowLeft'||e.code==='ArrowRight')&&(G.state==='title'||G.state==='over')){
    sceneIdx=(sceneIdx+(e.code==='ArrowRight'?1:4))%5; pclear(); sfxUi();
  }
});

// fail sequencing — the disgusted caw lands at the apex of the slow head turn,
// then the result panel slides in
setInterval(function(){
  if(G.state!=='fail') return;
  var ft=(performance.now()-G.failAt)/1000;
  if(!G.bwarghDone && ft>1.05){ G.bwarghDone=true; sfxBwargh(); }
  if(ft>1.95){ G.state='over'; }
},60);

/* ============================================================
   BOOT — idempotent, triple fallback (rAF + focus + delay)
   ============================================================ */
resize();
bakeSprites();
var booted=false;
function boot(){
  if(booted) return; booted=true;
  lastT=performance.now();
  requestAnimationFrame(frame);
}
boot();
window.addEventListener('focus', function(){ if(!booted) boot(); });
setTimeout(function(){ if(!booted) boot(); },300);
setTimeout(function(){ if(!booted) boot(); },1200);
</script>
